# ══════════════════════════════════════════════════════════════
#  .tmux.conf · Clear Dark · MacBook Air M2 · Writing Setup
# ══════════════════════════════════════════════════════════════

# ── ТЕРМИНАЛ ─────────────────────────────────────────────────
set -g  default-terminal   "tmux-256color"

# ── SHELL ─────────────────────────────────────────────────────
set -g default-shell /bin/zsh

# ── PREFIX: C-a ──────────────────────────────────────────────
set -g  prefix   C-a
unbind  C-b
bind-key C-a send-prefix

# ── ОБЩИЕ НАСТРОЙКИ ──────────────────────────────────────────
set -g  base-index      1          # окна с 1, не с 0
setw -g pane-base-index 1          # панели с 1
set -g  renumber-windows on        # перенумеровать окна при закрытии
set -g  history-limit   50000      # больше истории
set -sg escape-time     0          # без задержки для ESC в Neovim
set -g  focus-events    on         # передавать события фокуса (нужно Neovim)
set -g  display-time    2000       # сообщения 2 сек
set -g  status-interval 5          # обновлять статусбар каждые 5 сек

# ── МЫШЬ ─────────────────────────────────────────────────────
set -g mouse on

# ── ПЕРЕЗАГРУЗКА КОНФИГА ──────────────────────────────────────
unbind r
bind r source-file ~/.tmux.conf \; display "  tmux.conf reloaded"

# ── СПЛИТЫ ────────────────────────────────────────────────────
unbind %
unbind '"'
bind _  split-window -h  -c "#{pane_current_path}"
bind -  split-window -v  -c "#{pane_current_path}"
bind c  new-window        -c "#{pane_current_path}"   # новое окно в той же директории

# Поменять текущую директорию сессии
bind M-c attach-session -c "#{pane_current_path}"

# ── НАВИГАЦИЯ ПО ПАНЕЛЯМ (vim-style) ─────────────────────────
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ── РЕСАЙЗ ПАНЕЛЕЙ ───────────────────────────────────────────
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Зум панели
bind -r m resize-pane -Z

# ── НАВИГАЦИЯ ПО ОКНАМ ───────────────────────────────────────
bind -r C-h previous-window
bind -r C-l next-window
bind Tab   last-window          # переключиться на предыдущее окно

# ── SWAP ПАНЕЛЕЙ ─────────────────────────────────────────────
bind > swap-pane -D
bind < swap-pane -U

# ══════════════════════════════════════════════════════════════
#  COPY MODE — vi + pbcopy (macOS M2)
# ══════════════════════════════════════════════════════════════

setw -g mode-keys vi

# Вход в copy mode
bind Enter copy-mode
bind -n M-[ copy-mode     # Alt+[ — тоже войти

# vi-биндинги в copy mode
bind-key -T copy-mode-vi v     send -X begin-selection
bind-key -T copy-mode-vi V     send -X select-line
bind-key -T copy-mode-vi C-v   send -X rectangle-toggle
bind-key -T copy-mode-vi H     send -X start-of-line
bind-key -T copy-mode-vi L     send -X end-of-line

# ── КОПИРОВАНИЕ → pbcopy (macOS) ──────────────────────────────
# y — скопировать выделение в системный буфер macOS
bind-key -T copy-mode-vi y \
  send -X copy-pipe-and-cancel "pbcopy"

# Enter — тоже копирует
bind-key -T copy-mode-vi Enter \
  send -X copy-pipe-and-cancel "pbcopy"

# Правая кнопка мыши — скопировать (mouse drag)
bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send -X copy-pipe-and-cancel "pbcopy"

# Не выходить из copy mode при drag — отключить авто-выход
unbind -T copy-mode-vi MouseDragEnd1Pane

# Двойной клик — выделить слово + копировать
bind-key -T copy-mode-vi DoubleClick1Pane \
  select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "pbcopy"
bind-key -n DoubleClick1Pane \
  select-pane \; copy-mode -M \; send -X select-word \; send -X copy-pipe-and-cancel "pbcopy"

# Тройной клик — выделить строку + копировать
bind-key -n TripleClick1Pane \
  select-pane \; copy-mode -M \; send -X select-line \; send -X copy-pipe-and-cancel "pbcopy"

# Вставка из системного буфера — prefix + p
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# ── CLEAR DARK ─────────────────────────────────────────────────
# Стандартные цвета наследуются из выбранного профиля Terminal.app.
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"
set -g message-style "fg=black,bg=white"
set -g message-command-style "fg=black,bg=white"
setw -g mode-style "fg=black,bg=cyan"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=white,bg=default"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=black,bg=cyan,bold] #S #[default] "
set -g status-right "#[fg=brightblack] #{pane_current_path} │ #[fg=white]%H:%M "
setw -g window-status-style "fg=brightblack,bg=default"
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-style "fg=cyan,bg=default,bold"
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-activity-style "fg=yellow,bg=default"
setw -g window-status-separator ""
